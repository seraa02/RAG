# Knowledge Graph Ontology
#
# Defined in Phase 1, from direct inspection of the six-company 10-K corpus
# (NVDA, AMD, INTC, MSFT, AMZN, GOOGL). Every type below is backed by at
# least one real sentence found in data/processed/*.json -- see the
# `evidence` field on each type. This is deliberately NOT an open-ended
# "extract all entities" ontology (README/guide warning: that produces a
# graph nobody can query) -- it is scoped to what these filings actually
# say and what the Phase 5 benchmark needs to ask multi-hop questions
# about: competition, ownership, supply/customer relationships, and
# regulatory exposure.

status: DEFINED
defined_in_phase: 1

entity_types:
  - name: Company
    description: >
      A public or private business entity mentioned in a filing -- the
      filer itself, a competitor, a customer, a supplier, a subsidiary,
      or an acquired company.
    evidence: >
      "In the Data Center segment, we compete primarily against Intel
      Corporation (Intel) and Nvidia Corporation" (AMD 10-K)

  - name: Product
    description: >
      A named product, platform, or technology offered by a Company --
      hardware, software, or a branded platform.
    evidence: >
      "Introduced with the Blackwell architecture, our data-center-scale
      offerings..." (NVIDIA 10-K); "AMD Ryzen AI 300 Series processors"
      (AMD 10-K)

  - name: BusinessSegment
    description: >
      A reporting segment a Company organizes its business into, as
      disclosed in the filing (used for revenue/competition reporting).
    evidence: >
      "The Compute & Networking segment includes our Data Center
      accelerated computing..." (NVIDIA 10-K); "Competition in Data
      Center Segment... Competition in Client and Gaming Segment" (AMD 10-K)

  - name: RegulatoryBody
    description: >
      A government agency, regulator, or court with oversight, antitrust,
      or litigation authority over a Company.
    evidence: >
      "the DOJ and a number of state Attorneys General filed a lawsuit
      concerning our Search and Search advertising practices" (Alphabet
      10-K); "the JFTC issued a cease-and-desist order" (Alphabet 10-K);
      Federal Trade Commission, European Commission (EC), SEC, PCAOB all
      appear across the corpus.

  - name: Person
    description: >
      A named individual acting in an officer, director, or named-party
      capacity in the filing (e.g. an executive bio, a litigation party).
    evidence: >
      Executive biography sections naming officers and their prior roles
      (e.g. Intel 10-K officer bios referencing prior employers by name).

relationship_types:
  - name: COMPETES_WITH
    source: Company
    target: Company
    description: Direct competition disclosed in the filing, often per-segment.
    evidence: >
      "Our principal competitor in the supply of discrete graphics is
      Nvidia... and Intel" (AMD 10-K)

  - name: ACQUIRED
    source: Company
    target: Company
    description: Company on the source side acquired the Company on the target side.
    evidence: >
      "Our acquisition of Mellanox in 2020 expanded our offerings..."
      (NVIDIA 10-K); "the Xilinx acquisition" (AMD 10-K)

  - name: SUBSIDIARY_OF
    source: Company
    target: Company
    description: Source Company is a subsidiary/wholly-owned entity of target Company.
    evidence: >
      Follows directly from ACQUIRED relationships in this corpus (e.g.
      Xilinx, Mellanox post-acquisition) plus explicit subsidiary listings
      in Exhibit 21-style disclosures.

  - name: SUPPLIES
    source: Company
    target: Company
    description: Source Company is a disclosed supplier to the target Company.
    evidence: >
      "We have expanded our supplier relationships to build redundancy
      and resilience..." (NVIDIA 10-K)

  - name: CUSTOMER_OF
    source: Company
    target: Company
    description: Source Company is a disclosed customer of the target Company's products.
    evidence: >
      "AMD semi-custom SoC products power the Sony PlayStation 5, the
      Microsoft Xbox Series S and X game consoles" (AMD 10-K) — Sony and
      Microsoft are CUSTOMER_OF AMD.

  - name: PARTNERS_WITH
    source: Company
    target: Company
    description: A disclosed commercial partnership or joint investment, not a customer/supplier or competitive relationship.
    evidence: >
      "in September 2025, Nvidia announced a partnership and investment
      in Intel to partner on new data center and client platform
      products" (AMD 10-K)

  - name: DEPENDS_ON
    source: Company
    target: Company
    description: Source Company discloses a material business dependency on the target Company (distinct from a simple supplier relationship — usually framed as a risk factor).
    evidence: >
      "If we lose Microsoft Corporation's support for our products...
      our ability to sell our products could be materially adversely
      affected" (AMD 10-K)

  - name: REGULATED_BY
    source: Company
    target: RegulatoryBody
    description: The Company is disclosed as subject to oversight, an antitrust action, an investigation, or litigation brought by the RegulatoryBody.
    evidence: >
      "the DOJ and a number of state Attorneys General sued... alleging
      similar antitrust violations" (Alphabet 10-K); "we are litigating
      a number of matters alleging price fixing, monopolization... brought
      by state attorneys general and the Federal Trade Commission" (Amazon 10-K)

  - name: OFFERS_PRODUCT
    source: Company
    target: Product
    description: The Company develops, sells, or offers the Product.
    evidence: >
      "our first Tensor Core GPU in 2017... NVIDIA DRIVE stack for
      autonomous driving" (NVIDIA 10-K)

  - name: PART_OF_SEGMENT
    source: Product
    target: BusinessSegment
    description: The Product is reported under the given BusinessSegment.
    evidence: >
      "The Graphics segment includes GeForce GPUs for gaming and PCs,
      and Quadro/NVIDIA RTX GPUs for enterprise workstation graphics"
      (NVIDIA 10-K)

  - name: HAS_SEGMENT
    source: Company
    target: BusinessSegment
    description: The Company reports the given BusinessSegment in its filing.
    evidence: >
      "Competition in Data Center Segment... Competition in Client and
      Gaming Segment" (AMD 10-K)

  - name: OFFICER_OF
    source: Person
    target: Company
    description: The Person holds or held an officer/director role at the Company.
    evidence: >
      Executive biography sections in Item 10/Part III-equivalent
      disclosures naming officers and their roles.
